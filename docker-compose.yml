# Owner: Track 1 (Foundation, Auth, and API infrastructure)
# Responsible for: containerized deployment of frontend, backend, Postgres, and the Nginx reverse proxy.
#
# To change the exposed ports, edit the lines below ("host:container").
# On WSL2, ports 80 and 443 are sometimes blocked by Windows (Hyper-V/IIS) — use 7080/443 locally in that case.

services:
  nginx:
    image: nginx:alpine
    ports:
      # temporary http port: 7080
      - "7080:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    restart: unless-stopped

  # TODO: backend service — build backend/, run `npx prisma migrate deploy && npm start`
  # TODO: db service — postgres image, persistent volume
