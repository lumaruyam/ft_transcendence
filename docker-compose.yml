# Owner: Track 1 (Foundation, Auth, and API infrastructure)
# Responsible for: containerized deployment of frontend, backend, Postgres, and the Nginx reverse proxy.
#
# Stack note: backend service now runs Node.js + TypeScript (Fastify + Socket.IO + Prisma), replacing the
# earlier Go binary. Compiled output is a Node process (`node dist/server.js`), not a static Go binary.
#
# Base image note: all images are Debian-based (not Alpine), matching the base used in Inception.
# Node.js + Prisma depend on native binary engines built against glibc; Alpine's musl libc requires
# separate binaryTargets and carries a history of native-addon/DNS edge cases, so Debian avoids that
# whole class of problem and keeps every service on one consistent libc across the stack.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    networks:
      - app_net
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app_net
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/usr/share/nginx/html
    command: sh -c "cp -r /app/dist/. /usr/share/nginx/html/"
    # This container is expected to exit 0 after copying so it is not restarted

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro # accepted the nginx-setup setting
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - frontend_dist:/usr/share/nginx/html:ro
    ports:
      - "443:443"
      - "80:80" # confirm with infra/nginx/nginx.conf
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    networks:
      - app_net


networks:
  app_net:
    driver: bridge

volumes:
  db_data:
  frontend_dist:
