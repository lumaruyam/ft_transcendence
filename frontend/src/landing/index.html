<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcendance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Same token set as kanban/index.html and dashboard/index.html */
    :root {
      color-scheme: dark;
      --bg-app: #1e1f22;
      --bg-elevated: #383a40;
      --text: #f2f3f5;
      --text-muted: #949ba4;
      --border: #26282c;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --online: #23a55a;
      --warn: #f0b132;
      --danger: #ed4245;
      --shadow-lg: 0 14px 34px rgba(0, 0, 0, .2);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg-app: #e7e9ec;
        --bg-elevated: #fafafb;
        --text: #23252a;
        --text-muted: #62656c;
        --border: #dadce0;
        --shadow-lg: 0 14px 34px rgba(30, 34, 42, .09);
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg-app: #e7e9ec;
      --bg-elevated: #fafafb;
      --text: #23252a;
      --text-muted: #62656c;
      --border: #dadce0;
      --shadow-lg: 0 14px 34px rgba(30, 34, 42, .09);
    }

    body {
      font-family: "gg sans", "Segoe UI", system-ui, sans-serif;
      background: var(--bg-app);
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem;
      text-align: center;
      gap: 1.25rem;
    }

    .brand-badge {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.4rem;
    }

    h1 { font-size: 1.6rem; }

    .stub-notice {
      color: var(--text-muted);
      font-size: .85rem;
      max-width: 26rem;
    }

    .app-button {
      display: inline-block;
      background: var(--accent); color: #fff;
      text-decoration: none;
      font-weight: 700; font-size: 1.05rem;
      padding: .9rem 2.4rem;
      border-radius: 999px;
      box-shadow: var(--shadow-lg);
      transition: filter .15s ease, transform .12s ease;
    }
    .app-button:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .api-status {
      margin-top: .5rem;
      padding: .5rem .9rem;
      border-radius: 8px;
      font-size: .8rem;
      font-family: ui-monospace, monospace;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-muted);
    }
    .api-status.ok { color: var(--online); border-color: var(--online); }
    .api-status.warn { color: var(--warn); border-color: var(--warn); }
    .api-status.err { color: var(--danger); border-color: var(--danger); }

    .api-retry {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: .35rem .8rem;
      border-radius: 6px;
      font-size: .75rem;
      cursor: pointer;
      transition: color .15s ease, border-color .15s ease;
    }
    .api-retry:hover { color: var(--text); border-color: var(--accent); }

    .quick-links {
      display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem;
      margin-top: 1rem;
      max-width: 28rem;
    }
    .quick-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: .8rem;
      padding: .4rem .8rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: color .15s ease, border-color .15s ease, background-color .15s ease;
    }
    .quick-links a:hover { color: var(--text); border-color: var(--accent); background: var(--bg-elevated); }
  </style>
</head>
<body>
  <div class="brand-badge">T</div>
  <h1>Transcendance</h1>
  <p class="stub-notice">Cette page d'accueil est un stub, contenu de remplacement en attendant la vraie landing page.</p>

  <a class="app-button" href="/app">App</a>

  <div id="api-status" class="api-status pending">Verification du backend...</div>
  <button id="api-retry" class="api-retry" type="button">Reessayer</button>

  <nav class="quick-links">
    <a href="/login">Login</a>
    <a href="/signup">Signup</a>
    <a href="/forgot-password">Mot de passe oublie</a>
    <a href="/settings">Parametres</a>
    <a href="/legal/privacy">Confidentialite</a>
    <a href="/legal/terms">Conditions</a>
  </nav>

  <script type="module" src="./main.ts"></script>
</body>
</html>
