<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban – ft_transcendence</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 2rem; }
    #board-root { display: flex; gap: 1rem; align-items: flex-start; }
    .list-column { display: flex; flex-direction: column; gap: .5rem; width: 16rem; flex-shrink: 0; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: .75rem; }
    .list-title { font-size: .95rem; }
    .list-cards { display: flex; flex-direction: column; gap: .5rem; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 4px; padding: .6rem .75rem; font-size: .875rem; }
    .board-empty { color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div id="board-root"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
