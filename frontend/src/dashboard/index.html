<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – ft_transcendence</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    #project-list-root { display: flex; flex-direction: column; gap: .75rem; max-width: 32rem; }
    .project-card { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: #1e293b; border: 1px solid #334155; border-radius: 6px; text-decoration: none; color: #e2e8f0; }
    .project-card:hover { border-color: #6366f1; }
    .project-card-role { font-size: .75rem; color: #94a3b8; text-transform: uppercase; }
    .project-list-empty { color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Mes projets</h1>
  <div id="project-list-root"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
