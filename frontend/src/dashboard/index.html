<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – ft_transcendence</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Same token set as kanban/index.html — duplicated because this is a separate Vite MPA
       entry (no shared stylesheet across pages yet; see frontend/src/shared/, still a stub). */
    :root {
      color-scheme: dark;
      --bg-app: #1e1f22;
      --bg-topbar: #313338;
      --bg-main: #313338;
      --bg-elevated: #383a40;
      --text: #f2f3f5;
      --text-muted: #949ba4;
      --border: #26282c;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --shadow: 0 6px 18px rgba(0, 0, 0, .22);
      --shadow-lg: 0 14px 34px rgba(0, 0, 0, .2);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg-app: #e7e9ec;
        --bg-topbar: #f4f5f7;
        --bg-main: #eceef1;
        --bg-elevated: #fafafb;
        --text: #23252a;
        --text-muted: #62656c;
        --border: #dadce0;
        --shadow: 0 6px 18px rgba(30, 34, 42, .08);
        --shadow-lg: 0 14px 34px rgba(30, 34, 42, .09);
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg-app: #e7e9ec;
      --bg-topbar: #f4f5f7;
      --bg-main: #eceef1;
      --bg-elevated: #fafafb;
      --text: #23252a;
      --text-muted: #62656c;
      --border: #dadce0;
      --shadow: 0 6px 18px rgba(30, 34, 42, .08);
      --shadow-lg: 0 14px 34px rgba(30, 34, 42, .09);
    }

    body {
      font-family: "gg sans", "Segoe UI", system-ui, sans-serif;
      background: var(--bg-app);
      color: var(--text);
      min-height: 100vh;
    }

    .topbar {
      height: 56px;
      background: var(--bg-topbar);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
      transition: background-color .15s ease, border-color .15s ease;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .brand-badge {
      width: 28px; height: 28px; flex-shrink: 0;
      border-radius: 8px;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .75rem;
    }
    .topbar-title { font-weight: 600; font-size: .95rem; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }

    /* ---- Profile menu (same markup/behavior as kanban/profileMenu.ts) ---- */
    .profile-menu { position: relative; }
    .profile-avatar-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent); color: #fff;
      border: none; cursor: pointer;
      font-weight: 700; font-size: .85rem;
      transition: filter .15s ease;
    }
    .profile-avatar-btn:hover { filter: brightness(1.12); }
    .dropdown {
      position: absolute; top: calc(100% + 10px); right: 0;
      min-width: 240px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 8px;
      opacity: 0; pointer-events: none;
      transform: translateY(-6px) scale(.98);
      transition: opacity .12s ease, transform .12s ease;
      z-index: 50;
    }
    .dropdown.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .dropdown-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px; border-radius: 6px;
      color: var(--text); text-decoration: none; font-size: .85rem;
    }
    .dropdown-link { cursor: pointer; }
    .dropdown-item:hover { background: var(--border); }
    .dropdown-divider { height: 1px; background: var(--border); margin: 6px 4px; }
    .theme-toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px; font-size: .85rem;
    }
    .theme-switch {
      width: 36px; height: 20px; border-radius: 10px;
      background: var(--border); position: relative; cursor: pointer;
      transition: background-color .15s ease;
    }
    .theme-switch.on { background: var(--accent); }
    .theme-switch-knob {
      position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff;
      transition: left .15s ease;
    }
    .theme-switch.on .theme-switch-knob { left: 18px; }

    /* ---- Project list ---- */
    main { padding: 1.5rem; background: var(--bg-main); min-height: calc(100vh - 56px); }
    h1 { font-size: 1.25rem; margin-bottom: 1.25rem; }
    #project-list-root { display: flex; flex-direction: column; gap: .75rem; max-width: 32rem; }
    .project-card {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      text-decoration: none; color: var(--text);
      transition: border-color .15s ease;
    }
    .project-card:hover { border-color: var(--accent); }
    .project-card-role { font-size: .75rem; color: var(--text-muted); text-transform: uppercase; }
    .project-list-empty { color: var(--text-muted); font-size: .9rem; }
  </style>
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main>
    <h1>Mes projets</h1>
    <div id="project-list-root"></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
